<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Tengai · C++/WASM</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; touch-action: none; overscroll-behavior: none; }
    #game {
      width: min(100vw, calc(100vh * 10 / 7));
      height: min(100vh, calc(100vw * 7 / 10));
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #status {
      position: fixed; inset: 1rem; margin: 0; padding: 1rem;
      color: #fff; background: #400; overflow: auto;
      white-space: pre-wrap; user-select: text; -webkit-user-select: text;
      font: 14px/1.5 monospace;
    }
  </style>
</head>
<body>
  <canvas id="game" width="320" height="224" tabindex="0"></canvas>
  <pre id="status" hidden></pre>
  <script>
    var Module = {
      canvas: document.getElementById('game'),
      printErr: function (text) {
        const status = document.getElementById('status');
        status.textContent += String(text) + '\n';
      }
    };
    for (const eventName of ['contextmenu', 'dragstart', 'selectstart']) {
      document.addEventListener(eventName, event => event.preventDefault());
    }
    document.addEventListener('dblclick', event => event.preventDefault(), {passive: false});
    document.addEventListener('gesturestart', event => event.preventDefault(), {passive: false});
  </script>
  <script async type="text/javascript" src="Tengai.js"></script>
</body>
</html>
