<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="tengai-release" content="659e59ec">
  <title>Tengai · 纯 C++/WASM</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; touch-action: none; overscroll-behavior: none; }
    #landscape-shell { position: fixed; inset: 0; display: grid; place-items: center; }
    #cabinet { width: 100%; height: 100%; display: grid; place-items: center; }
    #game {
      width: min(100vw, calc(100vh * 10 / 7));
      height: min(100vh, calc(100vw * 7 / 10));
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #status {
      position: fixed; inset: 1rem; margin: 0; padding: 1rem;
      color: #fff; background: #400; overflow: auto;
      white-space: pre-wrap; user-select: text; -webkit-user-select: text;
      font: 14px/1.5 monospace;
    }
    #copy-error { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 4; }
    #controls { position: absolute; inset: 0; pointer-events: none; }
    #joystick {
      position: absolute; left: max(1rem, env(safe-area-inset-left)); bottom: max(1rem, env(safe-area-inset-bottom));
      width: min(28vw, 9rem); aspect-ratio: 1; border-radius: 50%;
      border: 2px solid #8889; background: #222a; pointer-events: auto; touch-action: none;
    }
    #joystick-knob {
      position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%;
      background: #bbb; box-shadow: 0 0 .5rem #000; pointer-events: none;
    }
    #action-a {
      position: absolute; right: max(1.2rem, env(safe-area-inset-right)); bottom: max(2rem, env(safe-area-inset-bottom));
      width: min(18vw, 5.5rem); aspect-ratio: 1; border: 2px solid #f99; border-radius: 50%;
      color: #fff; background: #a22c; font: 700 1.5rem system-ui; pointer-events: auto; touch-action: none;
    }
    #frontend-buttons {
      position: absolute; right: max(.8rem, env(safe-area-inset-right));
      bottom: max(8rem, calc(env(safe-area-inset-bottom) + 7rem));
      display: grid; gap: .45rem; pointer-events: auto;
    }
    #frontend-buttons button {
      min-width: 4.6rem; min-height: 2rem; padding: .25rem .65rem;
      border: 1px solid #bbbc; border-radius: 999px; color: #fff;
      background: #222c; font: 700 .72rem system-ui; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    @media (hover: hover) and (pointer: fine) { #controls { opacity: .45; } }
    @media (orientation: portrait) and (pointer: coarse) {
      #landscape-shell {
        inset: auto; left: 50%; top: 50%;
        width: 100vh; height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: 50% 50%;
      }
      #game {
        width: min(100vh, calc(100vw * 10 / 7));
        height: min(100vw, calc(100vh * 7 / 10));
      }
      #joystick { width: min(28vw, 7.5rem); }
      #action-a { width: min(18vw, 5rem); }
      #frontend-buttons { bottom: max(7rem, calc(env(safe-area-inset-bottom) + 6rem)); }
    }
  </style>
</head>
<body>
  <div id="landscape-shell">
    <main id="cabinet"><canvas id="game" width="320" height="224" tabindex="0"></canvas></main>
    <div id="controls" aria-label="触摸控制">
      <div id="joystick"><div id="joystick-knob"></div></div>
      <div id="frontend-buttons">
        <button id="coin" type="button">投币</button>
        <button id="start" type="button">开始</button>
      </div>
      <button id="action-a" type="button">A</button>
    </div>
  </div>
  <pre id="status" hidden></pre>
  <button id="copy-error" type="button" hidden>复制错误</button>
  <script>
    var Module = {
      canvas: document.getElementById('game'),
      printErr: function (text) {
        const status = document.getElementById('status');
        status.textContent += String(text) + '\n';
      }
    };
    for (const eventName of ['contextmenu', 'dragstart', 'selectstart']) {
      document.addEventListener(eventName, event => {
        if (event.target.closest?.('#status, #copy-error')) return;
        event.preventDefault();
      });
    }
    document.addEventListener('dblclick', event => event.preventDefault(), {passive: false});
    for (const eventName of ['gesturestart', 'gesturechange', 'gestureend']) {
      document.addEventListener(eventName, event => event.preventDefault(), {passive: false});
    }
    let wakeLock = null;
    const requestWakeLock = async () => {
      if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; }, {once: true});
      } catch (_) { wakeLock = null; }
    };
    for (const eventName of ['pointerdown', 'touchstart', 'keydown']) {
      document.addEventListener(eventName, requestWakeLock, {passive: true});
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    document.getElementById('copy-error').addEventListener('click', async () => {
      const text = document.getElementById('status').textContent;
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const selection = getSelection();
        const range = document.createRange();
        range.selectNodeContents(document.getElementById('status'));
        selection.removeAllRanges(); selection.addRange(range);
      }
    });
  </script>
  <script async type="text/javascript" src="Tengai-659e59ec.js"></script>
</body>
</html>
