*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b13;color:#e8edf5;font:14px system-ui;overscroll-behavior:none}
#viewport{position:fixed;inset:0;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow:hidden}

.system,.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}

.actions{width:100%;aspect-ratio:1;grid-template-rows:repeat(2,minmax(0,1fr))}
.actions button{width:100%;height:100%;border-radius:50%;font-size:22px;padding:2px}
.actions button:last-child{grid-column:2}
.actions button.debug-key{font-size:12px;border-style:dashed;color:#a4b4c8}

footer{display:flex;align-items:center;gap:8px;font-size:11px;color:#a4b4c8;min-width:0;overflow:hidden;white-space:nowrap}
footer>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
footer button{padding:4px 8px;border-radius:8px;font-size:12px;flex:none}
#error{color:#ffb5ae;max-width:30%;overflow:hidden;text-overflow:ellipsis}
#log-panel{position:fixed;inset:6%;background:#111b2b;border:1px solid #62718c;z-index:10;padding:12px;display:flex;flex-direction:column;gap:8px}
#log-panel[hidden]{display:none}
#log-panel textarea{flex:1;min-height:0;width:100%;font:12px monospace;background:#060c16;color:#e8edf5;user-select:text;-webkit-user-select:text;touch-action:auto}
#log-panel div{display:flex;gap:8px;flex-wrap:wrap}
